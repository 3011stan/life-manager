<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile { fill: #7a3e1d; }
    .mark { fill: none; stroke: #ffffff; }
    .dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e3a47c; }
      .mark { stroke: #1a1917; }
      .dot { fill: #1a1917; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" />
  <circle class="mark" cx="32" cy="32" r="17" stroke-width="5" />
  <circle class="dot" cx="32" cy="32" r="6" />
</svg>
