name: ci

on:
  push:
    branches: [main, "0*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # ADR 0007: the generated client must match the pinned contract.
      - run: npm run api:check
      - run: npm run build

  # 004 T007: the Playwright suite against the running app. The backend
  # repository is private, so this public repository reads it with a
  # read-only token (BACKEND_READ_TOKEN); without it the job is skipped with a
  # warning.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - name: Token check
        id: token
        env:
          TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::BACKEND_READ_TOKEN is not set; end-to-end tests skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          path: web
      - name: Backend branch (same name, else the staging branch)
        if: steps.token.outputs.present == 'true'
        id: backend
        env:
          TOKEN: ${{ secrets.BACKEND_READ_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/3011stan/life-manager-backend.git" "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=002-cloud-foundation" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          repository: 3011stan/life-manager-backend
          ref: ${{ steps.backend.outputs.ref }}
          token: ${{ secrets.BACKEND_READ_TOKEN }}
          path: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version-file: web/.nvmrc
      - if: steps.token.outputs.present == 'true'
        run: web/scripts/e2e-stack.sh
        env:
          BACKEND_DIR: ${{ github.workspace }}/backend
          WEB_DIR: ${{ github.workspace }}/web
